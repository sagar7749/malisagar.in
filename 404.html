<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Sagar Mali</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#05050b">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/favicon-96.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Unbounded:wght@500;700&amp;display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .not-found {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 40px var(--gutter);
      text-align: center;
    }
    .not-found .code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 22vw, 11rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 30%, #9d8cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .not-found h1 {
      margin: 18px 0 12px;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }
    .not-found p {
      max-width: 30rem;
      margin: 0 auto 30px;
      color: var(--muted);
    }
    .not-found .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 26px;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <img src="/img/logo.svg" width="70" height="46" alt="" style="margin: 0 auto 26px">
      <p class="code" aria-hidden="true">404</p>
      <h1>This page drifted off into space</h1>
      <p>The link may be old or mistyped. Everything else is still where it was.</p>
      <div class="actions">
        <a class="btn btn-glow" href="/">Back to the portfolio</a>
        <a class="link-underline" href="/resume.html">View my resume</a>
      </div>
    </div>
  </main>
</body>
</html>
