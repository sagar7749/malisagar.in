  <path d="M1088 414h296" stroke="#7fb3ff" stroke-opacity=".2"/>
  <rect x="1088" y="436" width="90" height="12" rx="6" fill="#dbe8ff"/>
  <rect x="1300" y="436" width="84" height="12" rx="6" fill="#dbe8ff"/>
