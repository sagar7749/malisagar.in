    <rect x="1088" y="282" width="16" height="16" rx="4" fill="#5eead4"/><rect x="1118" y="285" width="104" height="10" rx="5" fill="#cfe1ff" opacity=".85"/><rect x="1330" y="285" width="54" height="10" rx="5" fill="#5eead4"/>
    <rect x="1088" y="326" width="16" height="16" rx="4" fill="#9d8cff"/><rect x="1118" y="329" width="146" height="10" rx="5" fill="#cfe1ff" opacity=".85"/><rect x="1322" y="329" width="62" height="10" rx="5" fill="#9d8cff"/>
    <rect x="1088" y="370" width="16" height="16" rx="4" fill="#7fb3ff"/><rect x="1118" y="373" width="118" height="10" rx="5" fill="#cfe1ff" opacity=".85"/><rect x="1338" y="373" width="46" height="10" rx="5" fill="#7fb3ff"/>
