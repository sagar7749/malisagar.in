    <rect x="1088" y="610" width="40" height="90" rx="6" fill="#f6ad55" opacity=".85"/>
    <rect x="1140" y="560" width="40" height="140" rx="6" fill="#5eead4" opacity=".85"/>
    <rect x="1192" y="640" width="40" height="60" rx="6" fill="#9d8cff" opacity=".85"/>
    <rect x="1244" y="590" width="40" height="110" rx="6" fill="#7fb3ff" opacity=".85"/>
