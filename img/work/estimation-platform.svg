  <rect x="1088" y="500" width="160" height="10" rx="5" fill="#7fb3ff" opacity=".45"/>
  <rect x="1088" y="520" width="120" height="10" rx="5" fill="#7fb3ff" opacity=".3"/>

  <!-- status bar -->
  <rect x="0" y="852" width="1440" height="48" fill="#0b1b36"/>
  <path d="M0 852h1440" stroke="#7fb3ff" stroke-opacity=".18"/>
  <rect x="28" y="872" width="150" height="9" rx="4.5" fill="#7fb3ff" opacity=".5"/>
